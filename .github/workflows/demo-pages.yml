# Publica o frontend em modo demonstração (backend simulado) no GitHub Pages.
# Requer: Settings → Pages → Source: "GitHub Actions".
name: Publicar demo no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/demo-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
      - id: deployment
        uses: actions/deploy-pages@v4
